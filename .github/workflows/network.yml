name: Publish redirect to the new network map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Make the redirect page
        run: |
          mkdir out
          cat > out/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>EU-CFA Network tracker</title>
          <meta http-equiv="refresh" content="0; url=https://camilopallasco-arch.github.io/EU-WAEMU-PFI-TRACKER/network/">
          <link rel="canonical" href="https://camilopallasco-arch.github.io/EU-WAEMU-PFI-TRACKER/network/">
          <p>The network map has moved to <a href="https://camilopallasco-arch.github.io/EU-WAEMU-PFI-TRACKER/network/">its new address</a>.</p>
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v5
